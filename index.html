<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>সংকল্প OS</title>
  <meta name="description" content="সংকল্প OS — A premium, offline-first productivity vault for achievers." />
  <meta property="og:title" content="সংকল্প OS" />
  <meta property="og:description" content="সংকল্প OS — A premium, offline-first productivity vault for achievers." />

  <link rel="icon" type="image/png" href="/logo.png">
  <link href="/fonts/fonts.css" rel="stylesheet">

  <script src="/vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter','Hind Siliguri','system-ui','sans-serif'],
            bn: ['"Hind Siliguri"','Inter','system-ui','sans-serif'],
            display: ['"Hind Siliguri"','Inter','sans-serif'],
          },
          colors: {
            brand: {50:'#effaf6',100:'#d7f2e8',200:'#b0e4d2',300:'#7fcfb6',400:'#4db396',500:'#2a977b',600:'#1c7a63',700:'#186251',800:'#164e42',900:'#133f37',950:'#0a2420'}
          },
          boxShadow: {
            soft: '0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06)',
            glow: '0 0 40px rgba(28,122,99,.25)',
            card: '0 12px 30px -10px rgba(0,0,0,0.3)',
            gold: '0 15px 35px -5px rgba(217, 119, 6, 0.45)'
          },
          keyframes: {
            fadeIn: { from: { opacity: 0, transform: 'translateY(6px)' }, to: { opacity: 1, transform: 'none' } },
            pop: { '0%': { transform: 'scale(.92)', opacity: 0 }, '70%': { transform: 'scale(1.02)', opacity: 1 }, '100%': { transform: 'scale(1)', opacity: 1 } },
            equalizer: {
              '0%, 100%': { height: '6px' },
              '50%': { height: '24px' }
            },
            shimmerGold: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' }
            }
          },
          animation: {
            fadeIn: 'fadeIn .25s ease-out both',
            pop: 'pop .35s cubic-bezier(.34,1.56,.64,1) both',
            shimmerGold: 'shimmerGold 3s linear infinite',
            eq1: 'equalizer 1.2s ease-in-out infinite',
            eq2: 'equalizer 0.8s ease-in-out infinite 0.2s',
            eq3: 'equalizer 1.5s ease-in-out infinite 0.4s',
            eq4: 'equalizer 1s ease-in-out infinite 0.1s'
          }
        }
      }
    };
  </script>

  <script src="/vendor/react.production.min.js"></script>
  <script>
    if (typeof window.React === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"><\/script>');
    }
  </script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script>
    if (typeof window.ReactDOM === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"><\/script>');
    }
  </script>
  <script src="/vendor/lucide.min.js"></script>
  <script>
    if (typeof window.lucide === 'undefined') {
      document.write('<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"><\/script>');
    }
  </script>
  <script src="/vendor/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #f6f7f5;
      --ink: #111816;
      --brand: #1c7a63;
      --line: rgba(17,24,22,.08);
    }
    html.dark {
      --bg: #0b0f0e;
      --ink: #e8efec;
      --line: rgba(255,255,255,.07);
    }
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
    }
    body {
      background: var(--bg)!important;
      -webkit-tap-highlight-color: transparent;
      font-size: 15px;
      font-family: 'Inter', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
    .font-bn {
      font-family: 'Hind Siliguri', 'Inter', system-ui, sans-serif;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Fixed full-screen Modal support (Portalled to document.body) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow-y: auto;
    }

    /* 3D Flashcard Flip Mechanics & Aesthetics (Sleek Modern Radius) */
    .fc-flip-scene {
      perspective: 1400px;
      width: 100%;
    }
    .fc-flip-card {
      position: relative;
      width: 100%;
      min-height: 280px;
      transition: transform 0.65s cubic-bezier(0.34, 1.25, 0.64, 1);
      transform-style: preserve-3d;
      cursor: pointer;
      user-select: none;
    }
    .fc-flip-card.is-flipped {
      transform: rotateY(180deg);
    }
    .fc-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 0.875rem;
      padding: 1.5rem 1.25rem;
      border: 1px solid var(--line);
      box-shadow: 0 4px 20px -4px rgba(0,0,0,0.06);
      background: #ffffff;
      transition: box-shadow 0.3s ease;
    }
    html.dark .fc-face {
      background: #131a18;
      box-shadow: 0 4px 20px -4px rgba(0,0,0,0.4);
    }
    .fc-face:hover {
      box-shadow: 0 20px 45px -10px rgba(0,0,0,0.18);
    }
    .fc-face-front {
      z-index: 2;
    }
    .fc-face-back {
      transform: rotateY(180deg);
      background: linear-gradient(145deg, #ffffff 0%, #f0fdf9 100%);
      border-color: rgba(28, 122, 99, 0.25);
    }
    html.dark .fc-face-back {
      background: linear-gradient(145deg, #131a18 0%, #0d2620 100%);
      border-color: rgba(77, 179, 150, 0.25);
    }

    /* Bottom Nav & layout */
    .bnav {
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
      padding-bottom: max(.5rem, env(safe-area-inset-bottom));
    }
    .bnav-item { color: #7b8783; }
    .bnav-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 28px;
      border-radius: 999px;
      transition: all .2s;
    }
    .bnav-item.is-active { color: var(--brand); }
    .bnav-item.is-active .bnav-pill {
      background: color-mix(in srgb, var(--brand) 14%, transparent);
    }
    html.dark .bnav-item.is-active { color: #6fd1b2; }

    /* Flashcard Tiles in List (Sleek Radius) */
    .fc-tile {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      transition: all .2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fc-tile:hover {
      border-color: var(--brand);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -4px rgba(0,0,0,0.06);
    }
    html.dark .fc-tile { background: #121816; }
    .fc-dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: #4db396;
    }
    .fc-dot.is-hard { background: #f43f5e; }

    /* Circular Timer Progress Ring */
    .timer-ring-circle {
      transition: stroke-dashoffset 0.5s ease-in-out;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
  </style>
</head>
<body class="antialiased text-slate-800 dark:text-slate-100">
  <div id="root"></div>
  <script src="/app.js"></script>
  <script src="/native.js"></script>
</body>
</html>
